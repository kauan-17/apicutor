<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Inspeções</h2>
    <a routerLink="/dashboard" class="btn btn-outline-secondary btn-sm">Voltar</a>
  </div>

  <div *ngIf="loading" class="alert alert-info">Carregando...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="card" *ngIf="!loading">
    <div class="card-body p-0">
      <div *ngIf="inspecoes.length === 0" class="p-3 text-muted">Nenhuma inspeção encontrada.</div>
      <div class="table-responsive" *ngIf="inspecoes.length > 0">
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Data/Hora</th>
              <th>Observações</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let i of inspecoes">
              <td>{{ i.id }}</td>
              <td>{{ i.dataHora | date:'short' }}</td>
              <td>{{ i.observacoes }}</td>
              <td class="text-end">
                <a class="btn btn-sm btn-primary" [routerLink]="['/inspecoes', i.id]">Abrir</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
