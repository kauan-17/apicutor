<div class="container py-4">
  <h2 class="mb-3">Produção</h2>

  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Apiário</label>
      <select class="form-select" [(ngModel)]="selecionadoApiarioId" (change)="carregarColmeias()">
        <option [ngValue]="undefined">Selecione...</option>
        <option *ngFor="let a of apiarios" [value]="a.id">{{ a.nome }}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Colmeia</label>
      <select class="form-select" [(ngModel)]="selecionadoColmeiaId" (change)="carregarProducao()" [disabled]="!selecionadoApiarioId">
        <option [ngValue]="undefined">Selecione...</option>
        <option *ngFor="let c of colmeias" [value]="c.id">{{ c.identificacao || c.nome || ('Colmeia #' + c.id) }}</option>
      </select>
      </div>
    </div>

  <div *ngIf="loading" class="alert alert-info">Carregando...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <h5 class="mt-4">Registrar nova produção</h5>
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Data da Colheita</label>
        <input class="form-control" type="date" formControlName="dataColheita">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Tipo do Produto</label>
        <select class="form-select" formControlName="tipoProduto">
          <option [ngValue]="''">Selecione...</option>
          <option *ngFor="let t of tiposProduto" [value]="t.value">{{ t.label }}</option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Quantidade</label>
        <input class="form-control" type="number" step="0.01" formControlName="quantidade">
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Unidade de Medida</label>
        <select class="form-select" formControlName="unidadeMedida">
          <option [ngValue]="''">Selecione...</option>
          <option *ngFor="let u of unidadesMedida" [value]="u.value">{{ u.label }}</option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Lote</label>
        <input class="form-control" formControlName="lote" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Observações</label>
        <input class="form-control" formControlName="observacoes" />
      </div>
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="!selecionadoColmeiaId">Salvar</button>
  </form>

  <h5 class="mt-4">Registros</h5>
  <div class="table-responsive" *ngIf="!loading && producoes.length">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Data</th>
          <th>Tipo</th>
          <th>Qtd</th>
          <th>Unidade</th>
          <th>Lote</th>
          <th>Obs</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of producoes">
          <td>{{ p.dataColheita | date:'shortDate' }}</td>
          <td>{{ p.tipoProduto }}</td>
          <td>{{ p.quantidade }}</td>
          <td>{{ p.unidadeMedida }}</td>
          <td>{{ p.lote }}</td>
          <td>{{ p.observacoes }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <a routerLink="/dashboard" class="btn btn-secondary">Voltar ao Dashboard</a>
</div>
